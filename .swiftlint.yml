warning_threshold: 200
disabled_rules:
- switch_case_alignment
- todo
- fallthrough
- nesting
- trailing_whitespace
- type_name
- comment_spacing
opt_in_rules:
- attributes
- closure_end_indentation
- literal_expression_end_indentation
- operator_usage_whitespace
# Excluded Carthage sources and binaries
excluded:
- Pods
- .idea
- build
- WalletCoreWrapper
- Prox/Bluetooth Core/DTO
function_parameter_count:
  - 6
  - 8
function_body_length:
  - 60
  - 65
identifier_name:
  min_length: 2
line_length:
  - 130
  - 140
type_body_length:
  - 300
  - 350
file_length:
  - 500
  - 550
# Report via Xcode/AppCode
reporter: "xcode"
